<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        canvas {
            background-color: green;
        }
    </style>
    <script>
        let bal1 = {
            kleur: 'white',
            x: 50,
            y: 50,
            speedX: 1,
            speedY: 1
        };

        let bal2 = {
            kleur: 'yellow',
            x: 150,
            y: 100,
            speedX: 1,
            speedY: -0.5
        };

        let bal3 = {
            kleur: 'red',
            x: 250,
            y: 80,
            speedX: -1,
            speedY: -2
        };

        let lijst = [bal1, bal2, bal3];
        
        const radius = 10;
        let canvas;
        
        function drawCanvas() {
            canvas = document.getElementById('mijnCanvas');
            let context = canvas.getContext('2d');

            context.clearRect(0, 0, canvas.width, canvas.height);
            context.rect(0,0, canvas.width, canvas.height);
            context.fillStyle = 'green';
            context.fill();

            for (let b of lijst) {
                context.beginPath();
                context.arc(b.x, b.y, radius, 0, 2 * Math.PI);
                context.fillStyle = b.kleur;
                context.fill();

                b.x += b.speedX;
                b.y += b.speedY;

                if (b.y > canvas.height - radius || b.y < radius){
                    b.speedY *= -1;
                }
                if (b.x < radius || b.x > canvas.width - radius){
                    b.speedX *= -1;
                }
            }
        }

        function verwijderBal() {
            lijst.pop();
        }

        function nieuweBal() {
            let kleur1 = Math.random() * 255;
            let kleur2 = Math.random() * 255;
            let kleur3 = Math.random() * 255;

            canvas = document.getElementById('mijnCanvas');
            let b = {
                kleur: `rgb(${kleur1}, ${kleur2}, ${kleur3})`,
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speedX: Math.random() * 4 -2,
                speedY: Math.random() * 4- 2
            };

            if (b.x <= radius) {
                b.x = radius;
            }

            if (b.x >= canvas.width - radius) {
                b.x = canvas.width - radius;
            }

            if (b.y <= radius) {
                b.y = radius;
            }
            
            if (b.y >= canvas.height - radius) {
                b.y = canvas.height - radius;
            }
 
            lijst.push(b);
            console.log(b);
        }

        function saveGame() {
           localStorage.gameData = JSON.stringify(lijst); 
        }
        
        function loadGame() {
            if (localStorage.gameData){
                lijst = JSON.parse(localStorage.gameData);
            }   
        }

    </script>
</head>
<body onload="setInterval(drawCanvas, 10)">
    <h1>Biljarttafel</h1>
    <canvas width="500" height="300" id="mijnCanvas"></canvas>
    <br />
    <br />
    <button onclick="verwijderBal()">Verwijder</button>
    <button onclick="nieuweBal()">Nieuwe bal</button>
    <button onclick="saveGame()">Save game</button>
    <button onclick="loadGame()">Load game</button>
</body>
</html>
