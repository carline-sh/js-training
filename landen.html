<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        table {
            text-align: left;
            border-collapse: collapse;
            width: 80%;
            margin: auto;
        }

        td,
        th {
            border: 1px solid lightgrey;
            padding: 10px;
        }

        tr:nth-child(even) {
            background-color: antiquewhite;
        }

        tr:first-child {
            background-color: maroon;
            color: white;
        }

        .clickable {
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        let alleLanden = null;
        let sortAsc = true;

        function init() {
            $.getJSON('https://xanderwemmers.nl/data/countries.json', toonLanden);
        }

        function toonLanden(data) {
            if (alleLanden == null) {
                alleLanden = data;
            }

            document.getElementById('aantal').innerHTML = `Aantal landen: ${data.length} van ${alleLanden.length}`;

            document.getElementById('output').innerHTML = '';

            let tbl = document.createElement('table');

            let header = document.createElement('tr');

            let titels = ['Naam', 'Inwoners', 'Oppervlakte', 'Regio', 'Subregio', 'Hoofdstad', 'Vlag'];

            for (let titel of titels) {
                let th = document.createElement('th');
                th.innerHTML = titel;

                if (titel == 'Naam') {
                    th.onclick = sorteerOpNaam;
                    th.className = 'clickable';
                }

                if (titel == 'Inwoners') {
                    th.onclick = sorteerOpInwoners;
                    th.className = 'clickable';
                }
                header.append(th);
            }
            tbl.append(header);

            for (let land of data) {
                let row = document.createElement('tr');

                nieuweKolom(row, land.name.common);
                nieuweKolom(row, land.population.toLocaleString());
                nieuweKolom(row, land.area.toLocaleString()+ ' km2');
                nieuweKolom(row, land.region);
                nieuweKolom(row, land.subregion);
                nieuweKolom(row, land.capital);

                let td6 = document.createElement('td');
                let plaatje = document.createElement('img');
                plaatje.src = land.flags.svg;
                plaatje.width = 100;
                plaatje.title = land.flags.alt;
                td6.append(plaatje);

                row.append(td6);
                tbl.append(row);
            }

            document.getElementById('output').append(tbl);
        }

        function nieuweKolom(row, text) {
            let td = document.createElement('td');
            td.innerHTML = text;
            row.append(td);
        }

        function europeseLanden() {
            let result = alleLanden.filter(land => land.region == 'Europe');
            toonLanden(result);
        }

        function groteLanden() {
            let result = alleLanden.filter(land => land.population > 100000000);
            toonLanden(result);
        }

        function kleineLanden() {
            let result = alleLanden.filter(land => land.population < 1000);
            toonLanden(result);
        }

        function zoekLanden() {
            let zoekTekst = document.getElementById('zoekveld').value.toLowerCase();
            let result = alleLanden.filter(land => land.name.common.toLowerCase().includes(zoekTekst));
            toonLanden(result);
        }

        function sorteerOpNaam() {
            // alleLanden.sort((a,b) => a.name.common.localeCompare(b.name.common));
            // toonLanden(alleLanden);
            if (sortAsc)
                alleLanden.sort((a, b) => a.name.common.localeCompare(b.name.common));
            else
                alleLanden.sort((a, b) => b.name.common.localeCompare(a.name.common));

            sortAsc = !sortAsc;

            toonLanden(alleLanden);
        }

        function sorteerOpInwoners() {
            // alleLanden.sort((a,b) => a.population - b.population);
            // toonLanden(alleLanden);
            if (sortAsc)
                alleLanden.sort((a, b) => b.population - a.population);
            else
                alleLanden.sort((a, b) => a.population - b.population);

            sortAsc = !sortAsc;

            toonLanden(alleLanden);
        }

    </script>
</head>

<body onload="init()">
    <h1>Landen van de wereld</h1>
    <button onclick="europeseLanden()">Europese landen</button>
    <button onclick="groteLanden()">Grote landen</button>
    <button onclick="kleineLanden()">Kleine landen</button>
    <button onclick="toonLanden(alleLanden)">Alle landen</button>
    <input id="zoekveld" oninput="zoekLanden()">
    <!-- <button onclick="sorteerOpNaam()">Sorteer op naam</button> -->
    <p id="aantal">Aantal landen: 0</p>
    <h2 id="titels"></h2>
    <div id="output"></div>
</body>

</html>
