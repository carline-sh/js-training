<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(234, 234, 216);
        }
        img {
            width: 300px;
            height: 200px;
            margin: 20px;
            cursor: pointer;
        }

        .closed {
            opacity: 0.3;
            cursor: not-allowed;
        }
    </style>
    <script>
        let aantallen = {
            'Londen': 0,
            'Parijs': 0,
            'Berlijn': 0,
            'Praag': 0,
            'Reykjavik': 0
        }

        let totaal = 0;
        let max = 0;
        let winnaar = '';

        function stemmen(stad) {
             if (totaal == 10) {
                return;
            }

            totaal++;

            if (totaal == 10) {
                let plaatjes = document.getElementsByTagName('img');
                for (let plaatje of plaatjes) {
                    plaatje.className = 'closed';
                }
            }

            aantallen[stad]++;

            if(aantallen[stad] > max) {
                max = aantallen[stad];
                winnaar = stad;
            }
        
            document.getElementById('totaal').innerHTML = `Er is ${totaal} keer gestemd.`;
            document.getElementById('aantal' + stad).innerHTML = `Er is ${aantallen[stad]} keer op ${stad} gestemd.`;
            document.getElementById('winnaar').innerHTML = `De winnaar is: ${winnaar}`;
        }

        function reset() {
            totaal = 0;
            max = 0;
            winnaar = '';
            for (let stad in aantallen) {
                aantallen[stad] = 0;
                document.getElementById('aantal' + stad).innerHTML = `Er is ${aantallen[stad]} keer op ${stad} gestemd.`;
            }
            document.getElementById('totaal').innerHTML = `Er is ${totaal} keer gestemd.`;
            document.getElementById('winnaar').innerHTML = `De winnaar is: ${winnaar}`;
            let plaatjes = document.getElementsByTagName('img');
                for (let plaatje of plaatjes) {
                    plaatje.className = '';
                }
        }
    </script>
</head>
<body>
    <h1>Waarheen gaan we?</h1>
    <img onclick="stemmen('Londen')" src="https://xanderwemmers.nl/Londen.jpg">
    <img onclick="stemmen('Parijs')" src="https://xanderwemmers.nl/Parijs.jpg">
    <img onclick="stemmen('Berlijn')" src="https://xanderwemmers.nl/Berlijn.jpg">
    <img onclick="stemmen('Praag')" src="https://xanderwemmers.nl/Praag.jpg">
    <img onclick="stemmen('Reykjavik')" src="https://xanderwemmers.nl/Reykjavik.jpg">
    <h3 id="totaal">Er is in totaal zoveel keer gestemd.</h3>
    <p id="aantalLonden">Er is 0 keer op Londen gestemd</p>
    <p id="aantalParijs">Er is 0 keer op Parijs gestemd</p>
    <p id="aantalBerlijn">Er is 0 keer op Berlijn gestemd</p>
    <p id="aantalPraag">Er is 0 keer op Praag gestemd</p>
    <p id="aantalReykjavik">Er is 0 keer op Reykjavik gestemd</p>
    <h3 id="winnaar">De winnaar is:</h3>
    <button onclick="reset()">Reset stemmen</button>
</body>
</html>
