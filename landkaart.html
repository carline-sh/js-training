<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        #map {
            height: 500px;
        }

        button {
            margin: 20px;
        }

    </style>

    <script>

        let map;
        let lastMarker;

        function initMap() {
            map = L.map('map').setView([52, 5], 7);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);

            L.marker([51.500238, 4.866681]).addTo(map).bindPopup('Vlakbij huis');
            L.circle([52, 5], { radius: 10000, color: 'red', fillColor: 'yellow' }).addTo(map);

            $.getJSON("https://xanderwemmers.nl/api/ns", toonStations);
            map.on('click', mapClick)
        }

        function mapClick(args) {
            console.log(args);
            var positie = [args.latlng.lat, args.latlng.lng];
            map.flyTo(positie);

            if (lastMarker) {
                map.removeLayer(lastMarker);
            }

            lastMarker = L.marker(positie);
            lastMarker.addTo(map);
            // L.marker(positie).addTo(map);
            $.getJSON("https://xanderwemmers.nl/api/weather?query=" + positie, toonWeather);
        }

        function toonWeather(data) {
            console.log(data);
            var text = 
            
                `${data.location.name}
                <br />${data.location.region}
                <br />${data.location.country}
                <hr />
                <img src="${data.current.condition.icon}" />
                <br />${data.current.temp_c}
                <br />${data.current.condition.text}`
            
            lastMarker.bindPopup(text).openPopup();
        }

        function toonStations(stations) {
            console.log(stations.length);

            for (let st of stations) {
                let r = 500;

                if (st.Type == 'MEGA_STATION')
                    r = 2000;

                L.circle([st.Lat, st.Long], { radius: r, fillColor: 'yellow' }).addTo(map);

            }
        }

        function flyToRhodos() {
            map.flyTo([36.429816, 28.216855], 14);
        }

        function flyToBreda() {
            map.flyTo([51.582433, 4.774628], 13);
        }

        function flyHome() {
            navigator.geolocation.getCurrentPosition(showPosition);
        }

        function showPosition(data) {
            console.log(data);
            var home = [data.coords.latitude, data.coords.longitude];
            map.flyTo(home, 15);
            L.marker(home).addTo(map);
            L.circle(home, { radius: data.coords.accuracy, color: 'green' }).addTo(map);
        }   

    </script>


</head>

<body onload="initMap()">
    <h1>Landkaart</h1>
    <div id="map"></div>
    <button onclick="flyToRhodos()">Vlieg naar Rhodos</button>
    <button onclick="flyToBreda()">Vlieg naar Breda</button>
    <button onclick="flyHome()">Vlieg naar huis</button>
</body>

</html>
